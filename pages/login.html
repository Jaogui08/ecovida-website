<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVida - Login</title>
    <link rel="stylesheet" href="../css/login.css">
    
</head>
<body style="background-color: #f1f4f0; height: 75vh; display: flex; flex-direction: column; align-items: center; transform: scale(1.25); transform-origin: top left; width: 80%;">
    <form>
        <img src="../img/logo.png" style="width: 120px;">
        <h1 style="font-size: 1.6rem; font-weight: 500; margin-bottom: 20px;">Acesse sua conta</h1>

        <div class="inputs">
            <label>E-Mail</label>
            <input id="emailLogin" autocomplete="off" autocapitalize="off" autocorrect="off" type="email">
        </div>

        <div class="inputs">
            <label>Senha</label>
            <input id="passwdLogin" autocomplete="off" autocapitalize="off" autocorrect="off" type="password">
        </div>

        <button type="button" style="cursor: pointer;" id="btnLogin" class="botao">Entrar</button>        

        <div style="display: flex; gap: 25px;">
            <a style="color: #0000ff;" href="../index.html">Não possui uma conta?</a>
        </div>
    </form>

    <footer style="margin-top: 105px;">
        <p style="font-size: 1.1rem; font-style: italic; color: #89b289; font-weight: 500;">EcoVida™ - Uma Vida Bem Ecológica</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/login.js"></script>
</body>
</html>
