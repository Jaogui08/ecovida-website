<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVida - Check Out</title>
    <link rel="stylesheet" href="../css/pagamento.css">
    
</head>
<body style="background-color: #f1f4f0;">
    <nav>
        <div class="logo">
            <a href="../pages/home.html">
                <img src="../img/logo.png" style="height: 111px; width: 111px;">
            </a>
            <div class="search">
                <img src="../img/search.png" style="width: 45px; padding: 5px;">
                <input spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" type="text" style="padding: 5px; font-size: 20px; background-color: #e6f5e6; width: 300px; border: none; outline: none;">
            </div>
        </div>
        <div class="actions">
            <button>
                <img src="../img/dark-mode.png">
            </button>
            <a href="carrinho.html">
                <img src="../img/shop-cart.png">
            </a>
            <a href="">
                <img src="../img/user-photo.png" style="width: 60px;">
            </a>
            <a href="login.html">
                <img src="../img/logout.png">
            </a>
        </div> 
    </nav>

    <section>
        <div class="checkOut">
            <div class="payment">
                <h1 style="font-size: 2.5rem; margin-bottom: 35px;">Selecione o método de pagamento</h1>
                <div class="paymentMethods">
                    <div class="paymentMethodsCard">
                        <h1>Cartão de Crédito</h1>
                        <img src="../img/mastercard.png">
                    </div>
                    <div class="paymentMethodsCard">
                        <h1>Cartão de Débito</h1>
                        <img src="../img/visa.png">
                    </div>
                    <div class="paymentMethodsCard">
                        <h1>PIX</h1>
                        <img src="../img/pix.png">
                    </div>
                </div>
            </div>
            <div class="infos">
                <div class="infosPrice">
                    <div class="price">
                        <h1>Total produtos:</h1>
                        <h1 style="color: #678567; font-style: italic;">R$ <span id="totalProdutos">0,00</span></h1>
                    </div>
                    <div class="price">
                        <h1>Total frete:</h1>
                        <h1 style="color: #678567; font-style: italic;">R$ <span id="totalFrete">0,00</span></h1>
                    </div>
                    <div class="price">
                        <h1>Total geral:</h1>
                        <h1 style="color: #678567; font-style: italic;">R$ <span id="totalGeral">0,00</span></h1>
                    </div>
                </div>
                <button id="btnCompra">Finalizar compra</button>
            </div>
        </div>
    </section>

    <footer>
        <div class="socialMedias">
            <img src="../img/instagram.png">
            <img src="../img/whatsapp.png">
            <img src="../img/twitter.png">
        </div>

        <p style="margin-top: 30px; margin-bottom: 30px; color: #334233; font-weight: 600;">Copyright 2026 EcoVida™ by Eco Vida Comercio De Plantas E Flores Ltda</p>

        <div class="contact">
            <div class="phone">
                <img src="../img/phone.png">
                <p>(15) 99999-9999</p>
            </div>
            <div class="email">
                <img src="../img/email.png">
                <p>ecovidaplantas@gmail.com</p>
            </div>
        </div>

        <img style="width: 120px; margin-bottom: 20px; margin-top: 20px;" src="../img/logo.png">
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/pagamento.js"></script>
</body>
</html>
