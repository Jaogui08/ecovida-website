<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVida - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body style="background-color: #f1f4f0; height: 75vh; display: flex; flex-direction: column; align-items: center; transform: scale(1.25); transform-origin: top left; width: 80%;">
    <form>
        <img src="img/logo.png" style="width: 120px;">
        <h1 style="font-size: 1.6rem; font-weight: 500; margin-bottom: 20px;">Crie sua conta</h1>

        <div class="inputs">
            <label>Nome de Usuário</label>
            <input id="nome" autocomplete="off" type="text">
        </div>

        <div class="inputs">
            <label>E-Mail</label>
            <input id="email" autocomplete="off" type="email">
        </div>

        <div class="inputs">
            <label>Senha</label>
            <input id="passwd" autocomplete="off" type="password">
        </div>

        <div class="inputs">
            <label>CPF</label>
            <input id="cpf" autocomplete="off" type="text">
        </div>

        <button>Cadastrar-se</button>

        <div style="display: flex; gap: 25px;">
            <a style="color: #0000ff;" href="pages/login.html">Já possui uma conta?</a>
            <a style="color: #0000ff;" href="pages/cadastroadm.html">É um funcionário?</a>
        </div>
    </form>

    <footer style="margin-top: 35px;">
        <p style="font-size: 1.1rem; font-style: italic; color: #89b289; font-weight: 500;">EcoVida™ - Uma Vida Bem Ecológica</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
